name: CI

# Validation de build et tests sur chaque push et chaque PR vers main.
# Aucune clé Alpaca n'est fournie : les tests n'appellent jamais le réseau.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build du paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire le sdist et la wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Installer la wheel et vérifier le point d'entrée
        run: |
          python -m pip install dist/*.whl
          trading-agents --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Garde-fou : on force le mode paper et on vide les clés.
      ALPACA_API_KEY: ""
      ALPACA_SECRET_KEY: ""
      ALPACA_PAPER_TRADE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lancer pytest
        run: python -m pytest -q --junitxml=reports/junit-${{ matrix.python-version }}.xml
      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: reports/
          retention-days: 7

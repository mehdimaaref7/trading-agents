[project]
name = "trading-agents"
version = "0.1.0"
description = "Agents IA de trading en paper trading (Alpaca), avec gestion du risque codée en dur."
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.44",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trading-agents = "trading_agents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
